name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rald-identity
      - name: Fix identity.rald.cloud DNS and custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node << 'JSEOF'
          const token   = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const h = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
          const DOMAIN  = 'identity.rald.cloud';
          const PROJECT = 'rald-identity';
          async function cf(method, path, body) {
            const r = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method, headers: h, body: body ? JSON.stringify(body) : undefined
            });
            return r.json();
          }
          (async () => {
            // 1. Fetch the actual Pages project subdomain.
            //    CF API returns the field as "rald-identity-3xx.pages.dev" (includes .pages.dev suffix),
            //    so strip the suffix before re-appending to avoid doubling.
            const proj = await cf('GET', `/accounts/${account}/pages/projects/${PROJECT}`);
            if (!proj.success) { console.error('Could not fetch Pages project:', JSON.stringify(proj.errors)); return; }
            const rawSubdomain = proj.result?.subdomain ?? '';
            const subdomain    = rawSubdomain.replace(/\.pages\.dev$/i, '');
            const pagesUrl     = `${subdomain}.pages.dev`;
            console.log(`Pages subdomain (raw): ${rawSubdomain}  →  using: ${pagesUrl}`);

            // 2. Get rald.cloud zone
            const zones = await cf('GET', '/zones?name=rald.cloud');
            const zone  = zones.result?.[0];
            if (!zone) { console.log('WARN: rald.cloud zone not found'); return; }

            // 3. Ensure CNAME is correct (create or update)
            const dns = await cf('GET', `/zones/${zone.id}/dns_records?name=${DOMAIN}`);
            const rec = dns.result?.[0];
            if (rec) {
              if (rec.content !== pagesUrl) {
                console.log(`Fixing CNAME: "${rec.content}" → "${pagesUrl}"`);
                const upd = await cf('PUT', `/zones/${zone.id}/dns_records/${rec.id}`, {
                  type: 'CNAME', name: 'identity', content: pagesUrl, proxied: true
                });
                console.log(upd.success ? `✓ CNAME fixed to ${pagesUrl}` : 'CNAME update failed: ' + JSON.stringify(upd.errors));
              } else {
                console.log(`✓ CNAME already correct: ${pagesUrl}`);
              }
            } else {
              const cr = await cf('POST', `/zones/${zone.id}/dns_records`, {
                type: 'CNAME', name: 'identity', content: pagesUrl, proxied: true
              });
              console.log(cr.success ? `✓ Created CNAME ${DOMAIN} → ${pagesUrl}` : 'Create failed: ' + JSON.stringify(cr.errors));
            }

            // 4. Manage Pages custom domain — re-add if pending/missing
            const domains = await cf('GET', `/accounts/${account}/pages/projects/${PROJECT}/domains`);
            const domObj  = domains.result?.find(d => d.name === DOMAIN);
            if (!domObj) {
              const add = await cf('POST', `/accounts/${account}/pages/projects/${PROJECT}/domains`, { name: DOMAIN });
              const alreadyExists = add.errors?.some(e => e.code === 8000007);
              console.log(add.success ? `✓ Added ${DOMAIN}` : alreadyExists ? `✓ ${DOMAIN} already set` : 'Add failed: ' + JSON.stringify(add.errors));
            } else if (domObj.status === 'pending') {
              console.log(`${DOMAIN} still pending — deleting and re-adding to restart cert provisioning`);
              const del = await cf('DELETE', `/accounts/${account}/pages/projects/${PROJECT}/domains/${DOMAIN}`);
              if (del.success) {
                await new Promise(r => setTimeout(r, 2000));
                const re  = await cf('POST', `/accounts/${account}/pages/projects/${PROJECT}/domains`, { name: DOMAIN });
                console.log(re.success ? `✓ Re-added — cert will re-provision` : 'Re-add failed: ' + JSON.stringify(re.errors));
              } else {
                console.log('Delete failed:', JSON.stringify(del.errors));
              }
            } else {
              console.log(`✓ ${DOMAIN} status: ${domObj.status}`);
            }
          })().catch(e => console.error('[WARN]', e.message));
          JSEOF

      - name: Post-deploy smoke test
        run: |
          sleep 15
          ORIGIN=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 "https://rald-identity.pages.dev/" || echo "000")
          CUSTOM=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 "https://identity.rald.cloud/" || echo "000")
          echo "rald-identity.pages.dev (origin) → $ORIGIN"
          echo "identity.rald.cloud (custom) → $CUSTOM"
          [ "$ORIGIN" = "200" ] && echo "✓ Origin healthy" || echo "⚠ Origin: $ORIGIN"
          [ "$CUSTOM" = "200" ] && echo "✓ Custom domain live" || echo "NOTE: SSL cert may still be provisioning (normal for pending domains)"
        continue-on-error: true
